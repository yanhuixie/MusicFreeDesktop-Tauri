[package]
name = "musicfree-desktop"
version = "0.0.8"
description = "一个插件化的音乐播放器"
authors = ["猫头猫"]
license = "GPL"
edition = "2021"

# Tauri 移植（阶段0）：Electron 主进程的 Rust 等价物
# 见 .zcode/plans/20261020-tauri移植计划.md

[lib]
name = "musicfree_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_Foundation",
] }
reqwest = { version = "0.12", features = ["stream", "cookies", "json"] }
tokio = { version = "1", features = ["fs", "io-util"] }
futures-util = "0.3"
base64 = "0.22"
souvlaki = "0.8"
lofty = "0.22"
chardetng = "0.1"
encoding_rs = "0.8"
notify = "8"
zip = "2"
md-5 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package]
name = "musicfree-desktop"
version = "0.0.8"
description = "一个插件化的音乐播放器"
authors = ["猫头猫"]
license = "GPL"
edition = "2021"

# Tauri 移植（阶段0）：Electron 主进程的 Rust 等价物
# 见 .zcode/plans/20261020-tauri移植计划.md

[lib]
name = "musicfree_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
